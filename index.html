<!-- HTML -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈쇼핑 메인 페이지</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            margin: 0;
            padding: 0;
            color: #333;
            overflow: hidden;
        }
        .intro-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 3em;
            font-weight: bold;
            animation: doorOpen 4s ease-in-out forwards;
            z-index: 10;
        }
        @keyframes doorOpen {
            0% { clip-path: inset(0 0 0 0); }
            50% { clip-path: inset(0 50% 0 50%); }
            100% { clip-path: inset(0 0 0 0); opacity: 0; }
        }
        body.loaded {
            overflow: visible;
        }
        body.loaded .intro-animation {
            display: none;
        }
        body.loaded #content {
            opacity: 0;
            animation: fadeIn 2s ease-in-out forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        header {
            background-color: #ff6f61;
            padding: 15px;
            color: white;
            text-align: center;
            font-size: 2em;
            font-weight: bold;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-links {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }
        header a {
            color: white;
            margin: 0 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.7em;
        }
        header a:hover {
            text-decoration: underline;
        }
        #darkModeToggle {
            background-color: #ffffff;
            border: none;
            color: #ff6f61;
            font-weight: bold;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.7em;
            position: absolute;
            right: 20px;
            top: calc(100% + 10px);
        }
        #darkModeToggle:hover {
            background-color: #ffd1c1;
        }
        main {
            text-align: center;
            padding: 20px;
        }
        .clothes-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: auto;
            background-color: #f7f7f7;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        body.dark-mode .clothes-container {
            background-color: #f0f0f0;
        }
        .clothes-container img {
            transition: transform 0.3s ease;
            cursor: pointer;
            border-radius: 10px;
            width: 100%;
            height: auto;
        }
        .clothes-container img:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        footer {
            background-color: #ff6f61;
            padding: 20px;
            text-align: center;
            color: white;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        footer a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        footer a:hover {
            color: #ffd1c1;
            text-decoration: underline;
        }
        .social-links {
            margin-top: 10px;
        }
        .social-links a {
            margin: 0 10px;
            color: white;
            font-size: 1.5em;
            transition: transform 0.3s ease;
        }
        .social-links a:hover {
            transform: scale(1.2);
            color: #ffd1c1;
        }
    </style>
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const currentMode = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
            localStorage.setItem('theme', currentMode);
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
            }
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 4000);
        }
    </script>
</head>
<body>
    <div class="intro-animation">C1oud Team Project</div>
    <div id="content">
        <header>
            C1oud 홈쇼핑
            <div class="auth-links">
                <script>
                    if (sessionStorage.getItem('username')) {
                        document.write(`
                            <span>${sessionStorage.getItem('username')}님 환영합니다.</span>
                            <form action="logout.html" method="post" style="display: inline;">
                                <button type="button" onclick="logout()" style="background-color: #ffffff; border: none; color: #ff6f61; font-weight: bold; font-size: 0.7em; cursor: pointer;">로그아웃</button>
                            </form>
                        `);
                    } else {
                        document.write(`
                            <a href="signup.html">회원가입</a>
                            <a href="login.html">로그인</a>
                        `);
                    }

                    function logout() {
                        sessionStorage.removeItem('username');
                        window.location.href = 'index.html';
                    }
                </script>
            </div>
            <button id="darkModeToggle" onclick="toggleDarkMode()">다크 모드</button>
        </header>

        <main style="background: #ffffff; color: #333; padding: 50px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
<div class="clothes-container">
                <!-- 옷 이미지를 표시하는 예제 -->

                        'https://shop.supreme.com/cdn/shop/files/J101_FW24_MisterCartoonLeatherJacket_Black01_3446e7c1-dde4-47dd-a05a-b844d18e431c_360x.jpg?v=1728499432',
                        'https://shop.supreme.com/cdn/shop/files/J101_FW24_MisterCartoonLeatherJacket_Black01_3446e7c1-dde4-47dd-a05a-b844d18e431c_360x.jpg?v=1728499432',
                        'https://shop.supreme.com/cdn/shop/files/J101_FW24_MisterCartoonLeatherJacket_Black01_3446e7c1-dde4-47dd-a05a-b844d18e431c_360x.jpg?v=1728499432',
                        'https://shop.supreme.com/cdn/shop/files/J101_FW24_MisterCartoonLeatherJacket_Black01_3446e7c1-dde4-47dd-a05a-b844d18e431c_360x.jpg?v=1728499432',
                        'https://shop.supreme.com/cdn/shop/files/J101_FW24_MisterCartoonLeatherJacket_Black01_3446e7c1-dde4-47dd-a05a-b844d18e431c_360x.jpg?v=1728499432',
                        'https://shop.supreme.com/cdn/shop/files/J101_FW24_MisterCartoonLeatherJacket_Black01_3446e7c1-dde4-47dd-a05a-b844d18e431c_360x.jpg?v=1728499432',
                        'https://shop.supreme.com/cdn/shop/files/J101_FW24_MisterCartoonLeatherJacket_Black01_3446e7c1-dde4-47dd-a05a-b844d18e431c_360x.jpg?v=1728499432',
                        'https://shop.supreme.com/cdn/shop/files/J101_FW24_MisterCartoonLeatherJacket_Black01_3446e7c1-dde4-47dd-a05a-b844d18e431c_360x.jpg?v=1728499432',
                        'https://shop.supreme.com/cdn/shop/files/J101_FW24_MisterCartoonLeatherJacket_Black01_3446e7c1-dde4-47dd-a05a-b844d18e431c_360x.jpg?v=1728499432',
                        'https://shop.supreme.com/cdn/shop/files/J101_FW24_MisterCartoonLeatherJacket_Black01_3446e7c1-dde4-47dd-a05a-b844d18e431c_360x.jpg?v=1728499432',
                        'https://shop.supreme.com/cdn/shop/files/J101_FW24_MisterCartoonLeatherJacket_Black01_3446e7c1-dde4-47dd-a05a-b844d18e431c_360x.jpg?v=1728499432'
                    ];
                    
                    imageUrls.forEach((url, index) => {
                        document.write(`<img src='${url}' alt='옷 이미지 ${index + 1}'>`);
                    });
                </script>
            </div>
        </main>

        <footer>
            <div>
                <a href="https://store.musinsa.com/" target="_blank">무신사</a>
                <a href="https://www.lotteimall.com/" target="_blank">롯데 홈쇼핑</a>
                <a href="https://www.supremenewyork.com/" target="_blank">Supreme</a>
            </div>
            <div class="social-links">
                <a href="https://www.facebook.com" target="_blank">&#xf09a; Facebook</a>
                <a href="https://www.twitter.com" target="_blank">&#xf099; Twitter</a>
                <a href="https://www.instagram.com" target="_blank">&#xf16d; Instagram</a>
            </div>
            <p>&copy; 2024 C1oud 홈쇼핑. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
